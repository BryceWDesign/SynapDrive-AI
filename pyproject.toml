[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapdrive-ai"
version = "1.0.0"
description = "Governed neuroadaptive shared-autonomy runtime for simulation and labeled EEG research data"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.23,<3.0",
  "cryptography>=42,<48",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.6.0,<8.0",
  "pyright>=1.1.380,<2.0",
  "pytest>=7.0,<10.0",
  "pytest-cov>=5.0.0,<8.0",
  "ruff>=0.6.0,<1.0",
]

[project.scripts]
synapdrive-ai = "synapdrive_ai.main.cli:main"
synapdrive-dashboard = "synapdrive_ai.interface.web_dashboard:main"
synapdrive-benchmark = "synapdrive_ai.benchmarking.cli:main"
synapdrive-stress = "synapdrive_ai.stress.cli:main"
synapdrive-evidence = "synapdrive_ai.assurance.cli:main"
synapdrive-prepare-dataset = "synapdrive_ai.benchmarking.prepare_cli:main"

[tool.setuptools.packages.find]
include = ["synapdrive_ai*", "core*"]
exclude = ["synapdrive_ai.tests*"]
namespaces = false

[tool.setuptools.package-data]
synapdrive_ai = ["interface/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["synapdrive_ai/tests"]
pythonpath = ["."]
