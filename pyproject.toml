[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapdrive-ai"
version = "0.1.0"
description = "Simulation-first intent→safety→actuation pipeline (BCI-inspired)"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.23",
  "flask>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
