name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and development checks
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Type check (pyright)
        run: |
          pyright

      - name: Run tests + coverage
        run: |
          pytest -q --cov=synapdrive_ai --cov-report=term-missing --cov-report=xml --cov-fail-under=50

      - name: Run release validation
        run: |
          python -m scripts.run_v1_validation --out validation.json

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-py${{ matrix.python-version }}
          path: validation.json
